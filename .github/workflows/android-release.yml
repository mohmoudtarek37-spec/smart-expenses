name: Hesabaty Android Signed Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    name: Build signed Play Store Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: flutter_app
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check required release signing secrets
        shell: bash
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Missing release signing secret: $variable"
              exit 1
            fi
          done
      - name: Generate Android project
        run: flutter create --project-name hesabaty --org io.github.mohmoudtarek37spec --platforms=android .
      - name: Configure Android connectivity and callback
        run: dart tool/ensure_android_internet.dart
      - name: Prepare signed release
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          dart tool/configure_android_release.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build signed AAB
        run: >-
          flutter build appbundle --release --no-pub
          --dart-define=REQUIRE_ACCOUNT=true
          --dart-define=SUPABASE_URL=https://uusnulmlygtpgwecyuvc.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_ZYP1VZE40T35FIJh0w5hmg_ygnHgPgC
      - name: Confirm signed bundle exists
        shell: bash
        run: |
          test -s build/app/outputs/bundle/release/app-release.aab
          echo 'Release bundle built; Play Console upload and device validation remain required.'
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: hesabaty-android-signed-release-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
