<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="حساباتي" />
  <meta name="description" content="حساباتي - مدير مصروفاتك وأقساطك الشخصي دون سيرفر" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("hesabaty_ui_theme")==="dark"?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
  <script>try{const lang=localStorage.getItem("hesabaty_ui_language")==="en"?"en":"ar";document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr"}catch(e){document.documentElement.lang="ar";document.documentElement.dir="rtl"}</script>
  <script>try{const a=localStorage.getItem("hesabaty_ui_accent"),g=localStorage.getItem("hesabaty_ui_glass");document.documentElement.dataset.accent=a==="green"?"pink":(["yellow","mint","orange","blue","pink"].includes(a)?a:"yellow");document.documentElement.dataset.glass=g==="blur"?"blur":"clear"}catch(e){document.documentElement.dataset.accent="yellow";document.documentElement.dataset.glass="clear"}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=1.5.0" />
  <title>حساباتي | Smart Expenses</title>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <div class="profile-greeting"><div class="brand-title" id="welcomeName">أهلًا بيك 👋</div><div class="brand-sub">فلوسك في مكان واحد</div></div>
      </div>
      <div class="top-actions"><button class="icon-button lang-button" id="langToggle" type="button" aria-label="Switch to English" title="Language">EN</button><button class="icon-button theme-button" id="themeToggle" type="button" aria-label="تفعيل الوضع الداكن" title="تغيير المظهر"></button><button class="icon-button" id="topSettings" type="button" aria-label="الإعدادات" title="الإعدادات"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a2 2 0 0 1 1.9 1.4l.28.87c.4.16.78.38 1.12.64l.9-.2a2 2 0 0 1 2.13.93l.99 1.72a2 2 0 0 1-.25 2.31l-.63.68c.04.43.04.87 0 1.3l.63.68a2 2 0 0 1 .25 2.31l-.99 1.72a2 2 0 0 1-2.13.93l-.9-.2c-.34.26-.72.48-1.12.64l-.28.87a2 2 0 0 1-1.9 1.4h-2a2 2 0 0 1-1.9-1.4l-.28-.87a7 7 0 0 1-1.12-.64l-.9.2a2 2 0 0 1-2.13-.93l-.99-1.72a2 2 0 0 1 .25-2.31l.63-.68a7 7 0 0 1 0-1.3l-.63-.68a2 2 0 0 1-.25-2.31l.99-1.72a2 2 0 0 1 2.13-.93l.9.2c.34-.26.72-.48 1.12-.64l.28-.87A2 2 0 0 1 10 3.5h2Z"/><circle cx="11" cy="12.5" r="2.4"/></svg></button></div>
    </header>
    <div id="bannerArea" class="banner-area" aria-live="polite"></div>
    <main id="main" class="main" tabindex="-1"><div class="loading"><span class="spinner"></span> جاري فتح حساباتك...</div></main>
    <nav class="bottom-nav" aria-label="الصفحات الرئيسية">
      <span class="nav-glider" aria-hidden="true"></span>
      <button data-page="home" class="nav-button active"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span><span>الرئيسية</span></button>
      <button data-page="transactions" class="nav-button"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/></svg></span><span>المعاملات</span></button>
      <button id="fab" class="fab" type="button" aria-label="إضافة معاملة جديدة" title="إضافة معاملة">＋</button>
      <button data-page="installments" class="nav-button"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15l2 2 5-5"/></svg></span><span>الأقساط</span></button>
      <button data-page="analytics" class="nav-button"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-8M22 20V8M2 21h20"/></svg></span><span>التحليلات</span></button>
      
    </nav>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="hiddenImport" type="file" accept=".json,application/json" hidden />
  <input id="hiddenSmsFile" type="file" accept=".json,.txt,.csv,text/plain,text/csv,application/json" hidden />
  <script src="theme.js?v=1.5.0" defer></script>
  <script src="i18n.js?v=1.5.0" defer></script>
  <script src="app.js?v=1.5.0" defer></script>
  <script src="report.js?v=1.5.0" defer></script>
  <script src="ui.js?v=1.5.0" defer></script>
</body>
</html>
